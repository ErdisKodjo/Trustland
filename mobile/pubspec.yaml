name: trustland_mobile
description: >-
  TrustLand Mobile — application compagnon du registre foncier numérique
  TrustLand (Togo). Flutter, Material 3, design system « Cadastre ».
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Notifications push (Firebase Cloud Messaging)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # État & données
  provider: ^6.1.2
  dio: ^5.7.0
  intl: ^0.20.1

  # Sécurité
  flutter_secure_storage: ^9.2.2   # tokens JWT (Keychain / Keystore)
  local_auth: ^2.3.0               # biométrie (verrouillage inactivité)

  # Connectivité & cache hors-ligne
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3       # cache JSON léger (terrains, stats)

  # Capteurs & médias
  geolocator: ^13.0.1              # coordonnées GPS des terrains
  image_picker: ^1.1.2             # photo du terrain
  mobile_scanner: ^5.2.3           # scan QR (vérification documents)

  # Carte (OpenStreetMap, sans clé API)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Partage du certificat PDF
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/splash-icon.png
